<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría | Orbit Zero</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .ficha-container { max-width: 1000px; margin: 0 auto; padding-bottom: 80px; position: relative; }
        
        /* Botón Regresar Minimalista */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--orbit-blue); color: black; border-color: var(--orbit-blue); }

        /* Portada Grande e Inmersiva */
        .mission-cover {
            width: 100%;
            height: 500px;
            background-size: cover;
            background-position: center;
            position: relative;
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            display: none;
        }

        .content-body { padding: 0 20px; margin-top: -80px; position: relative; z-index: 5; }

        /* Telemetría */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 25px 0;
        }
        .data-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        .data-card:hover { border-color: var(--orbit-blue); background: rgba(0,212,255,0.05); }
        .data-card label { color: var(--orbit-blue); font-size: 0.6rem; text-transform: uppercase; display: block; letter-spacing: 1px; }
        .data-card span { font-size: 1rem; font-family: monospace; font-weight: bold; color: #fff; }

        /* Plan de Vuelo */
        .flight-plan { margin-top: 20px; padding-left: 25px; border-left: 2px solid var(--orbit-blue); }
        .plan-step { margin-bottom: 25px; position: relative; }
        .plan-step::before {
            content: '';
            position: absolute;
            left: -31px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: var(--orbit-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--orbit-blue);
        }

        /* Multimedia */
        .media-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }
        .media-scroll::-webkit-scrollbar { display: none; }
        .media-item {
            min-width: 280px;
            height: 180px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: zoom-in;
            transition: 0.3s;
        }
        .media-item:hover { transform: scale(1.02); border-color: var(--orbit-blue); }

        /* MODAL DE ZOOM */
        #image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #modal-img { max-width: 90%; max-height: 85%; border-radius: 10px; border: 1px solid var(--orbit-blue); box-shadow: 0 0 30px rgba(0,212,255,0.2); }

        @media (max-width: 600px) {
            .mission-cover { height: 350px; }
            .telemetry-grid { grid-template-columns: repeat(2, 1fr); }
            .content-body { margin-top: -40px; }
        }
    </style>
</head>
<body>

    <div id="image-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <div class="ficha-container">
        <a href="index.html" class="btn-back">← INICIO</a>
        
        <div id="loading-state" style="padding: 150px 20px; text-align: center; color: var(--orbit-blue); font-family: monospace;">Sincronizando telemetría...</div>
        
        <div id="mission-content" style="display:none;">
            <div id="f-cover" class="mission-cover"></div>

            <div class="content-body">
                <div class="hero-mission">
                    <span id="f-empresa" class="company-tag">--</span>
                    <h1 id="f-nombre" style="font-size: 2.8rem; margin: 10px 0; letter-spacing: -1px;">--</h1>
                </div>

                <div id="f-telemetry-grid" class="telemetry-grid"></div>

                <p id="f-descripcion" style="color:#aaa; line-height: 1.8; font-size: 1rem; max-width: 800px;"></p>

                <div id="f-crew-section" style="margin-top:50px; display:none;">
                    <h3 style="font-size:0.7rem; color:var(--orbit-blue); letter-spacing: 3px; text-transform: uppercase;">Personal de Misión</h3>
                    <div id="f-crew-wrapper" style="display:flex; gap:20px; overflow-x:auto; padding:20px 0;"></div>
                </div>

                <div id="f-plan-section" style="margin-top:50px; display:none;">
                    <h3 style="font-size:0.7rem; color:var(--orbit-blue); letter-spacing: 3px; text-transform: uppercase;">Plan de Vuelo</h3>
                    <div id="f-plan-list" class="flight-plan"></div>
                </div>

                <div id="f-media-section" style="margin-top:50px; display:none;">
                    <h3 style="font-size:0.7rem; color:var(--orbit-blue); letter-spacing: 3px; text-transform: uppercase;">Multimedia</h3>
                    <div id="f-media-scroll" class="media-scroll"></div>
                </div>
            </div>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const URL_REAL = "https://orbitacero.neocities.org/missions.json";
    
    // Cambiamos a este proxy que es más directo para archivos JSON
    const URL_PROXY = `https://corsproxy.io/?${encodeURIComponent(URL_REAL)}&t=${new Date().getTime()}`;

    async function loadFicha() {
        const params = new URLSearchParams(window.location.search);
        const missionId = params.get('id');
        if (!missionId) { window.location.href = 'index.html'; return; }

        try {
            const res = await fetch(URL_PROXY);
            if (!res.ok) throw new Error("Error en el proxy");
            
            // Con corsproxy.io, los datos vienen DIRECTOS, no dentro de .contents
            const missions = await res.json();
            
            const m = missions.find(i => i.id === missionId);
            
            if (m) {
                renderFicha(m);
            } else {
                document.getElementById('loading-state').innerText = "Misión no encontrada.";
            }
        } catch (e) { 
            console.error("Error persistente de CORS:", e);
            document.getElementById('loading-state').innerText = "El servidor de datos está bloqueado temporalmente.";
        }
    }

    function renderFicha(m) {
        // Mostramos el contenido y ocultamos el estado de carga
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('mission-content').style.display = 'block';

        // Portada
        if(m.portada) {
            const cover = document.getElementById('f-cover');
            cover.style.backgroundImage = `url('${m.portada}')`;
            cover.style.display = 'block';
        }

        // Datos básicos
        document.getElementById('f-nombre').innerText = m.nombre;
        document.getElementById('f-empresa').innerText = m.empresa;
        document.getElementById('f-descripcion').innerText = m.descripcion;

        const grid = document.getElementById('f-telemetry-grid');
        
        // LÓGICA DE TELEMETRÍA:
        // Si el grid está vacío, dibujamos todas las tarjetas
        if (grid.innerHTML.trim() === '') {
            if (m.detalles_tecnicos) {
                const dt = m.detalles_tecnicos;
                const labels = { 
                    nave: "Nave", 
                    cohete: "Lanzador", 
                    velocidad_actual: "Velocidad", 
                    distancia_tierra: "Distancia", 
                    altitud_lunar: "Altitud", 
                    duracion_mision: "Duración" 
                };
                
                Object.keys(labels).forEach(key => {
                    if (dt[key]) {
                        grid.innerHTML += `
                            <div class="data-card">
                                <label>${labels[key]}</label>
                                <span id="val-${key}">${dt[key]}</span>
                            </div>`;
                    }
                });
            }
        } else {
            // Si ya existen las tarjetas, SOLO actualizamos los valores numéricos
            actualizarSoloValores(m.detalles_tecnicos);
        }

        // Secciones que no cambian (Tripulación, Plan, Multimedia)
        renderSeccionesEstaticas(m.detalles_tecnicos);
    }

    function actualizarSoloValores(dt) {
        if (!dt) return;
        
        const elVel = document.getElementById('val-velocidad_actual');
        const elDist = document.getElementById('val-distancia_tierra');

        // Actualizamos con un efecto de color para que se note el cambio
        if (elVel && dt.velocidad_actual) {
            elVel.innerText = dt.velocidad_actual;
            elVel.style.color = "#00d4ff"; // Azul órbita
        }
        if (elDist && dt.distancia_tierra) {
            elDist.innerText = dt.distancia_tierra;
            elDist.style.color = "#00d4ff";
        }
    }

    function renderSeccionesEstaticas(dt) {
        if (!dt) return;

        // Tripulantes (Solo si el contenedor está vacío)
        const crewWrapper = document.getElementById('f-crew-wrapper');
        if (dt.tripulantes_datos && crewWrapper.innerHTML === '') {
            document.getElementById('f-crew-section').style.display = 'block';
            crewWrapper.innerHTML = dt.tripulantes_datos.map(t => `
                <div style="min-width:90px; text-align:center;">
                    <img src="${t.foto}" style="width:75px; height:75px; border-radius:50%; object-fit:cover; border:2px solid var(--orbit-blue); padding:3px; background:#000;">
                    <div style="font-size:0.7rem; margin-top:8px; color:#fff; font-weight:bold;">${t.nombre}</div>
                </div>
            `).join('');
        }

        // Plan de Vuelo (Solo si el contenedor está vacío)
        const planList = document.getElementById('f-plan-list');
        if (dt.plan_vuelo && planList.innerHTML === '') {
            document.getElementById('f-plan-section').style.display = 'block';
            planList.innerHTML = dt.plan_vuelo.map(step => `
                <div class="plan-step">
                    <strong style="display:block; font-size:0.75rem; color:var(--orbit-blue); font-family:monospace;">${step.tiempo}</strong>
                    <span style="font-size:0.95rem; color:#eee;">${step.accion}</span>
                </div>
            `).join('');
        }

        // Multimedia (Solo si el contenedor está vacío)
        const mediaScroll = document.getElementById('f-media-scroll');
        if (dt.multimedia && mediaScroll.innerHTML === '') {
            document.getElementById('f-media-section').style.display = 'block';
            mediaScroll.innerHTML = dt.multimedia.map(img => `
                <div class="media-item" style="background-image:url('${img}')" onclick="openZoom('${img}')"></div>
            `).join('');
        }
    }

    function openZoom(src) {
        const modal = document.getElementById('image-modal');
        document.getElementById('modal-img').src = src;
        modal.style.display = 'flex';
    }

    // Primera ejecución
    loadFicha();

    // Bucle de actualización cada 15 segundos para la telemetría
    setInterval(loadFicha, 15000);
</script>

</body>
</html>
